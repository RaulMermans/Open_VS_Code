name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (Ubuntu, Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ['22', '24']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Enable Linux Chromium user-namespace sandbox
        shell: bash
        run: |
          # Ubuntu 24.04 runners block unprivileged user namespaces. Chromium's
          # sandbox needs them. This does not pass --no-sandbox.
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
            test "$(cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns)" = "0"
          fi
          if [ -e /proc/sys/kernel/unprivileged_userns_clone ]; then
            sudo sysctl -w kernel.unprivileged_userns_clone=1
            test "$(cat /proc/sys/kernel/unprivileged_userns_clone)" = "1"
          fi

      - name: Reject tracked node_modules
        shell: bash
        run: |
          # A tracked packages/*/node_modules symlink makes npm ci fail with ENOTDIR.
          tracked="$(git ls-files | grep -E '(^|/)node_modules(/|$)' | grep -v '^packages/agent-core/tests/fixtures/' || true)"
          if [ -n "$tracked" ]; then
            echo "Tracked node_modules would break npm ci:"
            echo "$tracked"
            exit 1
          fi

      - name: Install dependencies
        shell: bash
        run: npm ci

      - name: Warm the browser once
        shell: bash
        working-directory: packages/agent-core
        run: |
          # The first Chromium start on a cold runner can exceed the product's 20 s launch timeout,
          # which failed real-browser tests intermittently. Start it once with the sandbox on; the
          # product timeout is unchanged.
          node --import tsx --input-type=module -e "
            const { detectBrowserProvisioning } = await import('./src/browser/browser-provisioning.ts');
            const d = detectBrowserProvisioning();
            if (d.status !== 'READY') { console.log('no browser to warm:', d.status); process.exit(0); }
            const { chromium } = await import('playwright-core');
            const t = Date.now();
            const b = await chromium.launch({ executablePath: d.executable.path, chromiumSandbox: true, timeout: 120000 });
            await b.close();
            console.log('browser warm in', Date.now() - t, 'ms');
          "

      - name: Typecheck
        shell: bash
        run: npm run typecheck

      - name: Lint
        shell: bash
        run: npm run lint

      - name: Run Deterministic Tests
        shell: bash
        run: npm test
        # Each workspace test process uses --test-timeout=120000 (no forced exit, so late results are reported).
        # A stuck test fails at that deadline instead of holding the job open.
        # Real FPS (>10 frames, >=30 FPS) is exercised on Linux.

      - name: Build
        shell: bash
        run: npm run build

      - name: Verify Git Diff & Clean Tree
        shell: bash
        run: git diff --check
