name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (${{ matrix.os }}, Node ${{ matrix.node-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node-version: ['22', '24']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Enable Linux Chromium user-namespace sandbox
        if: runner.os == 'Linux'
        shell: bash
        run: |
          # Ubuntu 24.04 runners block unprivileged user namespaces. Chromium's
          # sandbox needs them. This does not pass --no-sandbox.
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
            test "$(cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns)" = "0"
          fi
          if [ -e /proc/sys/kernel/unprivileged_userns_clone ]; then
            sudo sysctl -w kernel.unprivileged_userns_clone=1
            test "$(cat /proc/sys/kernel/unprivileged_userns_clone)" = "1"
          fi

      - name: Install dependencies
        shell: bash
        run: npm ci

      - name: Typecheck
        shell: bash
        run: npm run typecheck

      - name: Lint
        shell: bash
        run: npm run lint

      - name: Run Deterministic Tests
        shell: bash
        run: npm test
        # Each workspace test process uses --test-timeout=120000 and --test-force-exit.
        # A stuck test fails at that deadline instead of holding the job open.
        # Real FPS (>10 frames, >=30 FPS) runs on Linux. On shared macOS runners that
        # measurement is skipped unless OPEN_VS_CODE_MOTION_PERFORMANCE=1. A skip is
        # not a pass of the performance gate.

      - name: Build
        shell: bash
        run: npm run build

      - name: Verify Git Diff & Clean Tree
        shell: bash
        run: git diff --check
