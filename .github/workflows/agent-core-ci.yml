name: Agent Core CI

on:
  push:
    branches:
      - main
    paths:
      - 'packages/agent-core/**'
      - '.github/workflows/agent-core-ci.yml'
      - '.github/actions/setup-bun/**'
      - 'bun.lock'
      - 'package.json'
  pull_request:
    branches:
      - main
    paths:
      - 'packages/agent-core/**'
      - '.github/workflows/agent-core-ci.yml'
      - '.github/actions/setup-bun/**'
      - 'bun.lock'
      - 'package.json'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  agent-core-matrix:
    name: Test & Verify (${{ matrix.os }}, Node ${{ matrix.node-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node-version: ['22', '24']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Setup Bun & Install Dependencies
        uses: ./.github/actions/setup-bun

      - name: Typecheck Agent Core
        shell: bash
        run: bun --cwd packages/agent-core run typecheck

      - name: Lint Agent Core
        shell: bash
        run: bun --cwd packages/agent-core run lint

      - name: Run Deterministic Unit Tests (90 Tests)
        shell: bash
        run: bun --cwd packages/agent-core run test

      - name: Verify Git Diff & Clean Tree
        shell: bash
        run: git diff --check
