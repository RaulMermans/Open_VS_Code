name: Agent Open-Weight Model Evaluation

on:
  workflow_dispatch:
    inputs:
      model:
        description: "Open-weight model to evaluate via Ollama"
        required: true
        default: "qwen2.5-coder:7b"
        type: choice
        options:
          - "qwen2.5-coder:7b"
          - "qwen2.5-coder:1.5b"
          - "qwen2.5-coder:3b"
          - "llama3.2:3b"
          - "deepseek-coder:6.7b"
      context_window:
        description: "Context token window budget"
        required: true
        default: "8192"
        type: string
  schedule:
    - cron: '0 2 * * 0' # Weekly run on Sundays at 02:00 UTC

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  model-benchmark:
    name: Benchmark Open-Weight Model (${{ inputs.model || 'qwen2.5-coder:7b' }})
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Setup Bun & Install Dependencies
        uses: ./.github/actions/setup-bun

      - name: Install Ollama
        shell: bash
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          ollama --version

      - name: Start Ollama Service
        shell: bash
        run: |
          ollama serve > /tmp/ollama.log 2>&1 &
          sleep 3
          # Wait for Ollama to become responsive
          for i in {1..30}; do
            if curl -s http://localhost:11434/api/version > /dev/null; then
              echo "Ollama service is ready."
              break
            fi
            echo "Waiting for Ollama..."
            sleep 1
          done

      - name: Pull Target Model (${{ inputs.model || 'qwen2.5-coder:7b' }})
        shell: bash
        run: |
          MODEL="${{ inputs.model || 'qwen2.5-coder:7b' }}"
          echo "Pulling model: $MODEL"
          ollama pull "$MODEL"
          ollama list

      - name: Run Real Model Smoke Tests
        shell: bash
        run: |
          bun --cwd packages/agent-core run tests/evals/real-model-smoke.ts

      - name: Run Full 24-Task Read-Only Benchmark & Context Evaluation
        shell: bash
        run: |
          bun --cwd packages/agent-core run tests/evals/run-benchmark-cli.ts

      - name: Publish Evaluation Summary to GitHub Step Summary
        shell: bash
        run: |
          REPORT_PATH="packages/agent-core/evals/results/qwen2.5-coder-7b-report.md"
          CONTEXT_PATH="packages/agent-core/evals/results/qwen2.5-coder-7b-context-eval.md"
          
          if [ -f "$REPORT_PATH" ]; then
            cat "$REPORT_PATH" >> "$GITHUB_STEP_SUMMARY"
          fi
          
          if [ -f "$CONTEXT_PATH" ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            cat "$CONTEXT_PATH" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload Evaluation Result Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: model-eval-results-${{ inputs.model || 'qwen2.5-coder-7b' }}
          path: |
            packages/agent-core/evals/results/*.json
            packages/agent-core/evals/results/*.md
            /tmp/ollama.log
